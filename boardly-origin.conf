# Stable localhost-only origin. Keep this running during single-writer app updates.
server {
    listen 127.0.0.1:5318;
    server_name boardly.onetimesuite.com;
    client_max_body_size 100m;
    location /api/ {
        proxy_pass http://127.0.0.1:5317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_intercept_errors off;
    }
    location / {
        proxy_pass http://127.0.0.1:5317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 @boardly_unavailable;
    }
    location @boardly_unavailable {
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 5 always;
        return 503 '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="5"><title>Boardly is reconnecting</title><body style="background:#18181b;color:#fafafa;font:18px system-ui;margin:10vh auto;max-width:640px;padding:24px"><h1>Boardly is reconnecting</h1><p>We are briefly unavailable. This page will retry automatically in 5 seconds.</p><p>Your saved work remains stored. If you were confirming a payment, check your billing status before trying again.</p><a href="/app#/account" style="color:#a5b4fc">Return to your account</a></body></html>';
    }
}
