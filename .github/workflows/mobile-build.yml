name: Boardly mobile builds

on:
  workflow_dispatch:
  push:
    branches: ['feature/boardly-mobile-*']
    paths: ['mobile/**', '.github/workflows/mobile-build.yml']

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: node scripts/configure-cloud.cjs
      - run: npm run typecheck
      - run: npx expo prebuild --platform ios --no-install --template expo-template-bare-minimum@56.0.35
      - run: pod install --project-directory=ios
      - name: Compile the iOS simulator app
        run: xcodebuild -workspace ios/Boardly.xcworkspace -scheme Boardly -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios-simulator CODE_SIGNING_ALLOWED=NO ARCHS=arm64 build
      - name: Package simulator app
        run: tar -czf Boardly-ios-simulator.tar.gz -C build/ios-simulator/Build/Products/Release-iphonesimulator Boardly.app
      - uses: actions/upload-artifact@v4
        with:
          name: Boardly-iOS-simulator
          path: mobile/Boardly-ios-simulator.tar.gz
          if-no-files-found: error
