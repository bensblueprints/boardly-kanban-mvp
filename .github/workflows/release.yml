name: Release installers

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Windows + Linux installers. The macOS DMG is handled by mac-build.yml
# (existing OneTimeSuite workflow, triggers on the same tags + release
# publication), so macOS is intentionally absent from this matrix.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Windows installer (NSIS)
        if: runner.os == 'Windows'
        run: npm run dist -- --publish never

      - name: Linux installers (AppImage + deb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils
          npm run dist:linux -- --publish never

      - name: Attach installers to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.AppImage
            release/*.deb
          generate_release_notes: true
