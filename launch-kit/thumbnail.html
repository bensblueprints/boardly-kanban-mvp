<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(1200px 700px at 78% 30%, #1b2242 0%, #0d1120 55%, #090c16 100%);
    color: #eef1ff;
    display: flex;
    align-items: center;
    position: relative;
  }
  /* faint kanban grid motif in background */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,157,46,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,157,46,.05) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(900px 600px at 75% 40%, black 0%, transparent 75%);
  }
  .left {
    width: 600px; padding: 0 0 0 72px; position: relative; z-index: 2;
  }
  .brand { display: flex; align-items: center; gap: 18px; margin-bottom: 34px; }
  .brand img { width: 76px; height: 76px; border-radius: 18px;
    box-shadow: 0 0 34px rgba(255,157,46,.45); }
  .brand span { font-size: 30px; font-weight: 700; letter-spacing: .5px; color: #cdd5f5; }
  h1 {
    font-size: 64px; line-height: 1.04; font-weight: 800; letter-spacing: -1px;
    background: linear-gradient(92deg, #ffffff 20%, #ffc46b 85%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 22px;
  }
  .sub { font-size: 26px; color: #aab4d8; line-height: 1.35; margin-bottom: 36px; max-width: 470px; }
  .pill {
    display: inline-flex; align-items: center; gap: 12px;
    background: rgba(255,157,46,.12);
    border: 1.5px solid rgba(255,157,46,.55);
    box-shadow: 0 0 24px rgba(255,157,46,.22), inset 0 0 12px rgba(255,157,46,.08);
    color: #ffc46b; font-size: 24px; font-weight: 700;
    padding: 14px 26px; border-radius: 999px; margin-bottom: 30px;
  }
  .pill .dot { width: 10px; height: 10px; border-radius: 50%; background: #4ade80;
    box-shadow: 0 0 10px #4ade80; }
  .fine { font-size: 17px; color: #6d78a3; max-width: 460px; line-height: 1.5; }
  .right { position: absolute; right: -40px; top: 0; width: 660px; height: 720px; z-index: 1; }
  .shot-wrap {
    position: absolute; top: 215px; right: 40px; width: 640px; height: 252px;
    overflow: hidden; border-radius: 14px;
    transform: perspective(1100px) rotateY(-13deg) rotateX(2deg);
    box-shadow: -30px 40px 90px rgba(0,0,0,.65), 0 0 60px rgba(255,157,46,.14);
    border: 1px solid rgba(255,255,255,.09);
    background: #0a0d18;
  }
  .shot-wrap img {
    width: 950px; display: block;
    filter: brightness(1.35);
  }
  /* sync badge floating over the screenshot */
  .sync {
    position: absolute; top: 88px; right: 120px; z-index: 3;
    background: #141a30; border: 1.5px solid rgba(74,222,128,.5);
    box-shadow: 0 8px 30px rgba(0,0,0,.5), 0 0 22px rgba(74,222,128,.18);
    border-radius: 14px; padding: 14px 20px;
    display: flex; align-items: center; gap: 12px;
    font-size: 19px; font-weight: 600; color: #d7defa;
  }
  .sync svg { width: 26px; height: 26px; stroke: #4ade80; }
</style>
</head>
<body>
  <div class="grid"></div>

  <div class="left">
    <div class="brand">
      <img src="../build/icon.png" alt="Boardly">
      <span>Boardly</span>
    </div>
    <h1>Cloud<br>Sync</h1>
    <div class="sub">Your boards on every computer.<br>Always in sync — never visible in the cloud.</div>
    <div class="pill"><span class="dot"></span>$5 / month &nbsp;·&nbsp; unlimited devices</div>
    <div class="fine">Paste your token, done. Boards stay 100% local &mdash; sync only shuttles changes between your machines. Cancel anytime.</div>
  </div>

  <div class="right">
    <div class="sync">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/>
      </svg>
      2 devices &middot; synced just now
    </div>
    <div class="shot-wrap"><img src="../docs/screenshot.png" alt="Boardly app"></div>
  </div>
</body>
</html>
